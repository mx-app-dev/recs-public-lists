name: Deploy the public list page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The publishable key and the project URL come from repository secrets, so they are never in the repository.
      - name: Write the configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          APP_STORE_URL: ${{ vars.APP_STORE_URL }}
        run: |
          cat > site/config.js <<EOF
          window.PUBLIC_LIST_CONFIG = {
            supabaseUrl: "${SUPABASE_URL}",
            publishableKey: "${SUPABASE_PUBLISHABLE_KEY}",
            appStoreUrl: "${APP_STORE_URL}",
          };
          EOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
