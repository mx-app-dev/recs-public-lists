<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Keeps the link's token out of the requests this page makes (for example, cover images). -->
  <meta name="referrer" content="no-referrer">
  <!-- Public lists are for the people who have the link, not for search engines. -->
  <meta name="robots" content="noindex">
  <title>Shared list</title>
  <style>
    body {
      font-family: -apple-system, system-ui, sans-serif;
      margin: 0;
      padding: 24px 16px;
      background: #f2f2f7;
      color: #1c1c1e;
    }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    .note { color: #6e6e73; font-size: 0.95rem; margin: 0 0 20px; }
    .status {
      padding: 16px;
      background: #fff;
      border-radius: 12px;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
    }
    li {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      border-top: 1px solid #e5e5ea;
    }
    li:first-child { border-top: 0; }
    img {
      width: 40px;
      height: 60px;
      object-fit: cover;
      border-radius: 4px;
      background: #d1d1d6;
      flex: none;
    }
    .title { font-weight: 600; }
    .meta { color: #6e6e73; font-size: 0.9rem; }
    .public-note { margin-top: 6px; font-size: 0.95rem; }
    @media (prefers-color-scheme: dark) {
      body { background: #000; color: #f2f2f7; }
      .note, .meta { color: #98989d; }
      .status, ul { background: #1c1c1e; }
      li { border-top-color: #38383a; }
    }
  </style>
</head>
<body>
  <main>
    <h1 id="list-title">Shared list</h1>
    <p class="note">Read only. Anyone with this link can see the list.</p>
    <p id="status" class="status" hidden></p>
    <ul id="items"></ul>
  </main>

  <script src="../config.js"></script>
  <script>
    (() => {
      const titleEl = document.getElementById('list-title');
      const statusEl = document.getElementById('status');
      const listEl = document.getElementById('items');
      const config = window.PUBLIC_LIST_CONFIG || {};

      function showStatus(text) {
        statusEl.textContent = text;
        statusEl.hidden = false;
      }

      // Every value is written with textContent, so nothing from the list is read as HTML.
      function render(rows) {
        titleEl.textContent = rows[0].list_title;
        for (const row of rows) {
          // A list with nothing in it returns one row with no item.
          if (!row.item_title) continue;
          const li = document.createElement('li');
          if (row.item_cover_url) {
            const img = document.createElement('img');
            img.src = row.item_cover_url;
            img.alt = '';
            img.loading = 'lazy';
            li.append(img);
          }
          const text = document.createElement('div');
          const title = document.createElement('div');
          title.className = 'title';
          title.textContent = row.item_title;
          const meta = document.createElement('div');
          meta.className = 'meta';
          meta.textContent = [row.item_creator, row.item_year, row.item_category].filter(Boolean).join(' · ');
          text.append(title, meta);
          // The public note is written on purpose by the owner; the private note is never sent to this page.
          if (row.item_public_note) {
            const note = document.createElement('div');
            note.className = 'public-note';
            note.textContent = row.item_public_note;
            text.append(note);
          }
          li.append(text);
          listEl.append(li);
        }
        if (!listEl.children.length) showStatus('Nothing in this list yet.');
      }

      async function load() {
        const token = new URLSearchParams(location.search).get('t') || '';
        // The token is 32 hexadecimal characters (128 bits), as the server makes it.
        if (!/^[0-9a-f]{32}$/.test(token)) {
          showStatus("This link doesn't show a list.");
          return;
        }
        if (!config.supabaseUrl || !config.publishableKey || config.publishableKey === 'PLACEHOLDER') {
          showStatus('The page is not connected yet.');
          return;
        }
        try {
          const response = await fetch(`${config.supabaseUrl}/rest/v1/rpc/get_public_list`, {
            method: 'POST',
            headers: {
              apikey: config.publishableKey,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ p_token: token }),
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const rows = await response.json();
          // An unknown token and a revoked one look the same from here, on purpose.
          if (rows.length === 0) {
            showStatus('This list is no longer shared, or the link is wrong.');
            return;
          }
          render(rows);
        } catch (error) {
          console.error('list not loaded', error);
          showStatus("The list couldn't be loaded. Try again later.");
        }
      }

      load();
    })();
  </script>
</body>
</html>
