<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The link's token is after "#", so it is not sent to this server. This also stops it being sent to the images the page loads. -->
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<!-- Public lists are for the people who have the link, not for search engines. -->
<meta name="robots" content="noindex">
<!-- Link previews (WhatsApp, iMessage) read these tags from the HTML, so they are the same for every list. -->
<meta property="og:title" content="Shared list · Recs2">
<meta property="og:description" content="A list shared from the Recs2 app.">
<meta property="og:type" content="website">
<title>Shared list · Recs2</title>
<style>
/* Sage & Sand (shared list). The collaboration tokens are kept for step 9g. */
:root,[data-theme="shared"]{
  --bg:#F4F1EA; --surface:#FFFFFF; --border:#E4DFD3; --chip-border:#D6D0C2;
  --text:#1F2A24; --text-2:#3E4A43; --muted:#5E6B63;
  --accent:#4F7A64; --accent-soft:#DCE7DF; --accent-ink:#2C4A3B;
  --tile:#EEF3EE; --cta-bg:#E2EBE3; --link:#3F6652; --link-hover:#2C4A3B;
  --header-bg:rgba(244,241,234,.92); --on-accent:#fff; --on-text:#fff;
}
[data-theme="collab"]{
  --bg:#F3F1F8; --border:#E3DFEF; --chip-border:#D9D4E8;
  --text:#221F33; --text-2:#3A3552; --muted:#615C78;
  --accent:#5B4FC4; --accent-soft:#E4E0F7; --accent-ink:#352C8A;
  --cta-bg:#E7E3F6; --link:#4A3FB0; --link-hover:#352C8A;
  --header-bg:rgba(243,241,248,.92);
}
/* Dark mode, for people who use dark appearance: the same tokens with dark values. Text on the accent colour stays
   dark, so the buttons keep their contrast. */
@media (prefers-color-scheme: dark){
  :root,[data-theme="shared"]{
    --bg:#1A1F1C; --surface:#242B27; --border:#36403A; --chip-border:#46514B;
    --text:#EEF2EE; --text-2:#C9D3CC; --muted:#9AA59E;
    --accent:#7FB096; --accent-soft:#2C3D34; --accent-ink:#CFE6D8;
    --tile:#2A3530; --cta-bg:#2A3A31; --link:#9CC7B0; --link-hover:#C4E3D3;
    --header-bg:rgba(26,31,28,.92); --on-accent:#0F1A14; --on-text:#1A1F1C;
  }
  [data-theme="collab"]{
    --bg:#1C1A24; --surface:#26232F; --border:#3A3646; --chip-border:#4A4560;
    --text:#EDEAF6; --text-2:#C8C3DB; --muted:#A29CB8;
    --accent:#A89CF0; --accent-soft:#332D57; --accent-ink:#DCD7FA;
    --cta-bg:#2F2A45; --link:#B6ACF5; --link-hover:#D5CFFA;
    --header-bg:rgba(28,26,36,.92); --on-accent:#120F24; --on-text:#1C1A24;
  }
}
[hidden]{display:none !important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
a{color:var(--link)} a:hover{color:var(--link-hover)}
.page{max-width:480px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px;background:var(--header-bg);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);font-weight:700}
.mark{width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;font-size:14px}
.btn{min-height:44px;padding:0 18px;border:0;border-radius:999px;background:var(--accent);
  color:var(--on-accent);font:600 15px/1 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn:hover{color:var(--on-accent)}
main{padding:24px 16px 8px;display:flex;flex-direction:column;gap:22px}
.hero{display:flex;flex-direction:column;gap:10px}
.badge{align-self:flex-start;padding:4px 10px;border-radius:999px;background:var(--accent-soft);
  color:var(--accent-ink);font-size:13px;font-weight:600}
h1{margin:0;font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.owner{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted)}
.owner strong{color:var(--text)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);
  display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--chip-border);
  background:var(--surface);color:var(--text);font:500 14px/1 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--on-text);font-weight:600}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px;
  display:flex;gap:12px;align-items:flex-start}
.tile{flex:none;width:46px;height:46px;border-radius:14px;background:var(--tile);
  display:grid;place-items:center;font-size:24px}
.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.card h2{margin:0;font-size:17px;font-weight:700}
.meta{font-size:13px;color:var(--muted)}
.note{margin:4px 0 0;font-size:15px;color:var(--text-2)}
.cta{background:var(--cta-bg);border-radius:22px;padding:22px 18px;display:flex;flex-direction:column;
  gap:12px;text-align:center;align-items:center}
.cta .emoji{font-size:30px}
.cta h2{margin:0;font-size:20px;font-weight:800}
.cta p{margin:0;font-size:15px;color:var(--text-2)}
.cta .btn{width:100%;min-height:50px;font-size:16px;font-weight:700}
.status{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;margin:0;color:var(--text-2)}
[data-theme="collab"] .hero{gap:12px}
.hint{font-size:13px;color:var(--muted);margin:0}
.hint a{color:var(--link);font-weight:600}
footer{padding:20px 16px 36px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 20px;font-size:13px}
footer a,footer button{color:var(--muted);min-height:32px;display:flex;align-items:center;background:none;border:0;padding:0;font:inherit;cursor:pointer}
.report{margin:0 16px;display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px}
.report label{font-size:13px;color:var(--muted)}
.report select,.report textarea{font:inherit;font-size:15px;color:var(--text);background:var(--bg);border:1px solid var(--chip-border);border-radius:12px;padding:10px}
.report textarea{min-height:80px;resize:vertical}
.report button{min-height:44px;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font:600 15px/1 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;cursor:pointer}
.report button:disabled{opacity:.6}
.report .cancel{background:none;color:var(--muted)}
.report .counter{font-size:12px;color:var(--muted);text-align:right}
</style>
</head>
<body data-theme="shared">
<div class="page">
  <header class="top">
    <a class="brand" href="/"><span class="mark" aria-hidden="true">✦</span>Recs2</a>
    <a id="open-app" class="btn" href="#">Subscribe</a>
  </header>

  <main>
    <noscript><p class="status">This page needs JavaScript to show the list.</p></noscript>
    <p id="status" class="status" hidden></p>

    <section id="content" class="hero" hidden>
      <span id="badge" class="badge" hidden></span>
      <h1 id="title"></h1>
      <div class="owner"><span class="avatar" id="initials" aria-hidden="true"></span><span id="owner"></span></div>
    </section>

    <nav id="chips" class="chips" aria-label="Filter by category" hidden></nav>

    <ul id="items" class="items" hidden></ul>

    <section id="cta" class="cta" hidden>
      <span id="cta-emoji" class="emoji" aria-hidden="true">🔔</span>
      <h2 id="cta-heading">Don't miss new titles</h2>
      <p id="cta-text"></p>
      <a id="open-app-cta" class="btn" href="#">Subscribe</a>
    </section>

    <p id="app-note" class="hint" hidden></p>
  </main>

  <section id="report-panel" class="report" aria-labelledby="report-heading" hidden>
    <h2 id="report-heading" style="margin:0;font-size:17px">Report this list</h2>
    <p class="hint">Reports are anonymous: no name, no email.</p>
    <form id="report-form">
      <label for="report-reason">Reason</label>
      <select id="report-reason" name="reason" required>
        <option value="spam">Spam</option>
        <option value="harassment">Harassment</option>
        <option value="illegal">Illegal content</option>
        <option value="other" selected>Something else</option>
      </select>
      <label for="report-note">Note (optional)</label>
      <textarea id="report-note" name="note" maxlength="500" placeholder="What should we look at?"></textarea>
      <div class="counter" id="report-counter">0 / 500</div>
      <button id="report-send" class="send" type="submit">Send report</button>
      <button id="report-cancel" class="cancel" type="button">Cancel</button>
      <p id="report-status" role="status" class="hint"></p>
    </form>
  </section>

  <footer>
    <button id="report" type="button" aria-expanded="false" aria-controls="report-panel">Report this list</button>
    <a href="mailto:mrichter.appdev@gmail.com">Contact</a>
  </footer>
</div>

<script src="../config.js"></script>
<script>
(() => {
  const config = window.PUBLIC_LIST_CONFIG || {};
  const $ = (id) => document.getElementById(id);

  // Books, series and movies are the only categories (step 3). Anything else shows as "Other".
  const CATEGORY = {
    book: { label: 'Books', emoji: '📚' },
    series: { label: 'Series', emoji: '📺' },
    movie: { label: 'Movies', emoji: '🎬' },
  };
  const categoryOf = (name) => CATEGORY[name] || { label: 'Other', emoji: '🏷️' };

  // Opening the app: the browser asks first. If the page is still visible a moment later, the app is probably not
  // installed, so the App Store button appears. A visit that leaves the page cancels that.
  let fallbackTimer = null;
  function offerAppStore() {
    const note = $('app-note');
    note.textContent = '';
    if (config.appStoreUrl) {
      const a = document.createElement('a');
      a.href = config.appStoreUrl;
      a.textContent = 'Get Recs2 on the App Store';
      note.append(a);
    } else {
      note.textContent = "Recs2 isn't in the App Store yet.";
    }
    note.hidden = false;
  }
  function wireAppButton(button, url) {
    button.href = url;
    button.addEventListener('click', () => {
      clearTimeout(fallbackTimer);
      fallbackTimer = setTimeout(() => { if (!document.hidden) offerAppStore(); }, 1500);
    });
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden) clearTimeout(fallbackTimer); });

  function showStatus(text) {
    const status = $('status');
    status.textContent = text;
    status.hidden = false;
  }

  function initials(name) {
    return name.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join('') || '•';
  }

  // Everything is written with textContent, so no text from the list is read as HTML.
  function renderHeader(summary) {
    const owner = summary.owner_name || '';
    // The variant comes from the list kind: shared lists are Sage & Sand, collaboration lists Dusk Lavender.
    document.body.dataset.theme = summary.list_kind === 'collaboration' ? 'collab' : 'shared';
    $('title').textContent = summary.list_title;
    document.title = summary.list_title + ' · shared by ' + (owner || 'a Recs2 user');
    $('initials').textContent = initials(owner || '?');
    const line = $('owner');
    line.textContent = '';
    const by = document.createElement('span');
    by.append('by ');
    const strong = document.createElement('strong');
    strong.textContent = owner || 'a Recs2 user';
    by.append(strong, ' · ' + summary.item_count + (summary.item_count === 1 ? ' title' : ' titles'));
    line.append(by);
    if (summary.recent_count > 0) {
      const badge = $('badge');
      badge.textContent = '✨ ' + summary.recent_count + ' new this week';
      badge.hidden = false;
    }
    $('cta-text').textContent = 'Follow ' + (owner ? owner + "'s" : 'this') +
      ' list and get a ping when titles are added. Free in the iPhone app.';
    $('content').hidden = false;
    $('cta').hidden = false;
  }

  // The collaboration variant (Dusk Lavender) for a list opened with its join link (step 9h). Visitors see the owner's
  // name and counts only: no member names or initials, and no notes. The button opens the app's join flow.
  function renderCollabHeader(summary, token) {
    const owner = summary.owner_name || '';
    const members = summary.member_count || 0;
    const titles = summary.item_count || 0;
    document.body.dataset.theme = 'collab';
    $('title').textContent = summary.list_title;
    document.title = summary.list_title + ' · Recs2 collaboration list';
    $('initials').textContent = initials(owner || '?');
    const line = $('owner');
    line.textContent = '';
    const by = document.createElement('span');
    by.append('by ');
    const strong = document.createElement('strong');
    strong.textContent = owner || 'a Recs2 user';
    by.append(
      strong,
      ' · ' + members + (members === 1 ? ' member' : ' members'),
      ' · ' + titles + (titles === 1 ? ' title' : ' titles'),
    );
    line.append(by);
    const badge = $('badge');
    badge.textContent = '🤝 Collaboration list';
    badge.hidden = false;
    const joinUrl = 'recs2://join/' + encodeURIComponent(token);
    $('open-app').textContent = 'Join';
    $('open-app').href = joinUrl;
    $('open-app-cta').href = joinUrl;
    $('open-app-cta').textContent = 'Join the list';
    $('cta-emoji').textContent = '💬';
    $('cta-heading').textContent = 'Add titles, comment, react';
    $('cta-text').textContent = 'Join to add your own titles and see what the others think. Comments are only visible to members.';
    $('content').hidden = false;
    $('cta').hidden = false;
  }

  // The day the owner added the item, in the reader's language. Empty when the date is missing or unreadable.
  function formatAdded(value) {
    const date = value ? new Date(value) : null;
    if (!date || Number.isNaN(date.getTime())) return '';
    return date.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function renderItems(rows) {
    const items = rows.filter((row) => row.item_title);
    const counts = {};
    items.forEach((row) => { counts[row.item_category] = (counts[row.item_category] || 0) + 1; });

    const chips = $('chips');
    const all = document.createElement('button');
    all.className = 'chip';
    all.type = 'button';
    all.setAttribute('aria-pressed', 'true');
    all.dataset.category = '';
    all.textContent = 'All ' + items.length;
    chips.append(all);
    Object.keys(counts).forEach((name) => {
      const cat = categoryOf(name);
      const chip = document.createElement('button');
      chip.className = 'chip';
      chip.type = 'button';
      chip.setAttribute('aria-pressed', 'false');
      chip.dataset.category = name;
      chip.textContent = cat.emoji + ' ' + cat.label + ' ' + counts[name];
      chips.append(chip);
    });
    chips.hidden = items.length === 0;
    chips.addEventListener('click', (event) => {
      const chip = event.target.closest('.chip');
      if (!chip) return;
      chips.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(c === chip)));
      const wanted = chip.dataset.category;
      document.querySelectorAll('#items .card').forEach((card) => {
        card.hidden = wanted !== '' && card.dataset.category !== wanted;
      });
    });

    const list = $('items');
    items.forEach((row) => {
      const cat = categoryOf(row.item_category);
      const li = document.createElement('li');
      li.className = 'card';
      li.dataset.category = row.item_category;
      const tile = document.createElement('span');
      tile.className = 'tile';
      tile.setAttribute('aria-hidden', 'true');
      tile.textContent = cat.emoji;
      const body = document.createElement('div');
      body.className = 'body';
      const h2 = document.createElement('h2');
      h2.textContent = row.item_title;
      const meta = document.createElement('span');
      meta.className = 'meta';
      const added = formatAdded(row.item_added_at);
      meta.textContent = [cat.label, row.item_creator, row.item_year, added && 'Added ' + added].filter(Boolean).join(' · ');
      body.append(h2, meta);
      // The public note is written on purpose by the owner. The private note and the recommender's name never appear here.
      if (row.item_public_note) {
        const note = document.createElement('p');
        note.className = 'note';
        note.textContent = '“' + row.item_public_note + '”';
        body.append(note);
      }
      li.append(tile, body);
      list.append(li);
    });
    list.hidden = items.length === 0;
    if (items.length === 0) showStatus('Nothing in this list yet.');
  }

  async function rpc(name, token) {
    const response = await fetch(config.supabaseUrl + '/rest/v1/rpc/' + name, {
      method: 'POST',
      headers: { apikey: config.publishableKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_token: token }),
    });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    return response.json();
  }

  // Counts one view of this list for its owner (step 9f). Sent once per page load, and only from a real page:
  // link previews do not run scripts, so they are not counted. A failure is ignored; the page does not depend on it.
  function recordView(token) {
    fetch(config.supabaseUrl + '/rest/v1/rpc/record_list_view', {
      method: 'POST',
      headers: { apikey: config.publishableKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_token: token }),
      keepalive: true,
      referrerPolicy: 'no-referrer',
    }).catch(() => {});
  }

  // Reports go to the database with the same rules as the app: a valid link, one of the four reasons, a note of up to
  // 500 characters, and at most ten reports per list an hour. The link token is sent in the request body, not the URL.
  let reportToken = null;
  let reportRpc = null;
  function setupReport(token, rpc, title) {
    reportToken = token;
    reportRpc = rpc;
    $('report-heading').textContent = 'Report “' + (title || 'this list') + '”';
  }

  // The form is hidden until the visitor asks for it. Cancel closes it again and returns focus to the button.
  function setReportOpen(open) {
    $('report-panel').hidden = !open;
    $('report').setAttribute('aria-expanded', String(open));
    if (open) $('report-reason').focus();
  }
  $('report').addEventListener('click', () => setReportOpen($('report-panel').hidden));
  $('report-cancel').addEventListener('click', () => {
    setReportOpen(false);
    $('report').focus();
  });
  $('report-note').addEventListener('input', () => {
    $('report-counter').textContent = $('report-note').value.length + ' / 500';
  });

  $('report-form').addEventListener('submit', async (event) => {
    event.preventDefault();
    const status = $('report-status');
    const send = $('report-send');
    if (!reportToken || !reportRpc) {
      status.textContent = "This list can't be reported right now.";
      return;
    }
    send.disabled = true;
    status.textContent = 'Sending…';
    try {
      const response = await fetch(config.supabaseUrl + '/rest/v1/rpc/' + reportRpc, {
        method: 'POST',
        headers: { apikey: config.publishableKey, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          p_token: reportToken,
          p_reason: $('report-reason').value,
          p_note: $('report-note').value.trim(),
        }),
        referrerPolicy: 'no-referrer',
      });
      if (response.ok) {
        status.textContent = 'Thank you. Your report has been sent.';
        $('report-form').reset();
        $('report-counter').textContent = '0 / 500';
      } else {
        const body = await response.json().catch(() => ({}));
        status.textContent = body.message === 'rate_limited'
          ? 'Too many reports for this list recently. Please try again later.'
          : "The report couldn't be sent. Please try again later.";
      }
    } catch (error) {
      status.textContent = "The report couldn't be sent. Check your connection and try again.";
    } finally {
      send.disabled = false;
    }
  });

  async function load() {
    // The token is after "#", so it is never sent to this server or written to its logs.
    const token = location.hash.slice(1);
    // The token is 32 hexadecimal characters (128 bits), as the server makes it.
    if (!/^[0-9a-f]{32}$/.test(token)) {
      showStatus("This link doesn't show a list.");
      return;
    }
    const listUrl = 'recs2://list/' + encodeURIComponent(token);
    wireAppButton($('open-app'), listUrl);
    wireAppButton($('open-app-cta'), listUrl);
    if (!config.supabaseUrl || !config.publishableKey || config.publishableKey === 'PLACEHOLDER') {
      showStatus('The page is not connected yet.');
      return;
    }
    try {
      const [summaryRows, rows] = await Promise.all([
        rpc('get_public_list_summary', token),
        rpc('get_public_list', token),
      ]);
      if (summaryRows.length > 0) {
        setupReport(token, 'report_public_list', summaryRows[0].list_title);
        recordView(token);
        renderHeader(summaryRows[0]);
        renderItems(rows);
        return;
      }
      // Not a public list: it may be a collaboration list opened with its join link (step 9h).
      const [collabRows, collabItems] = await Promise.all([
        rpc('get_collab_list_summary', token),
        rpc('get_collab_list_items', token),
      ]);
      if (collabRows.length > 0) {
        setupReport(token, 'report_join_link', collabRows[0].list_title);
        renderCollabHeader(collabRows[0], token);
        renderItems(collabItems);
        return;
      }
      // An unknown token and a stopped one look the same from here, on purpose.
      showStatus('This list is no longer shared, or the link is wrong.');
    } catch (error) {
      console.error('list not loaded', error);
      showStatus("The list couldn't be loaded. Try again later.");
    }
  }

  load();
})();
</script>
</body>
</html>
